{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#1d2433; --muted:#6b7280; --bg:#f5f6f8; --card:#fff; --accent:#1f7a4d; --danger:#b3261e; --border:#e2e4e9; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:var(--bg); color:var(--fg); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:1rem; background:#fff; }
  .btn { display:inline-block; border:0; border-radius:8px; padding:9px 14px; font-size:.95rem; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.secondary { background:#e8eaed; color:var(--fg); }
  .btn.danger { background:var(--danger); }
  .btn.link { background:none; color:var(--accent); padding:0; }
  .pill { font-size:.75rem; padding:2px 8px; border-radius:999px; background:#eef1f4; color:var(--muted); }
  .pill.active { background:#e3f3ea; color:var(--accent); }
  .pill.stopped { background:#fbe7e5; color:var(--danger); }
  .inline { display:inline; }
  .err { background:#fbe7e5; color:var(--danger); padding:10px 12px; border-radius:8px; margin:10px 0; }
  .task { border-top:1px solid var(--border); padding:10px 0; }
  .task:first-child { border-top:0; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .done { text-decoration: line-through; color: var(--muted); }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
</style>
<link rel="stylesheet" href="/static/reminder-picker.css">
<script src="/static/cronstrue.min.js" defer></script>
<script src="/static/reminder-picker.js" defer></script>
{{end}}
