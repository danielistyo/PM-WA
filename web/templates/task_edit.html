<!DOCTYPE html>
<html lang="en">
<head>{{template "head"}}<title>Edit Task</title></head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Edit Task</h1>
      <a href="/lists/{{.List.ID}}">Back</a>
    </div>

    <form method="post" action="/lists/{{.List.ID}}/tasks/{{.Task.Position}}" class="card">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <label for="title">Title</label>
      <input id="title" name="title" required maxlength="200" value="{{.Task.Title}}">

      <label for="assign">Assignees (comma-separated phone numbers)</label>
      <input id="assign" name="assign" required value="{{.AssigneeCSV}}">

      <label for="deadline">Deadline</label>
      <input id="deadline" name="deadline" type="datetime-local" step="60" required value="{{.DeadlineText}}">

      <label for="reminder">Reminder</label>
      {{template "reminder_field" .ReminderText}}

      <div class="actions">
        <button class="btn" type="submit">Save changes</button>
        <a class="btn secondary" href="/lists/{{.List.ID}}">Cancel</a>
      </div>
    </form>
    <script>
    (function(){
      var d = document.querySelector('[name="deadline"]');
      if (d && d.value) d.value = d.value.replace(' ', 'T');
      var f = d && d.closest('form');
      if (f) f.addEventListener('submit', function(){
        if (d.value) d.value = d.value.replace('T', ' ');
      });
    })();
    </script>
  </div>
</body>
</html>
